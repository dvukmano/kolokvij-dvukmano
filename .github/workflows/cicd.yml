name: CI/CD Kolokvij

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}
  OCIR_REGION_KEY: fra
  OCIR_REPO: kolokvij/app
  IMAGE_TAG: ${{ github.sha }}

jobs:

  build:
    name: Build, test i push slike
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '17'

      - name: Build s Mavenom
        run: ./mvnw -B package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Login na OCIR
        if: github.event_name == 'push'
        uses: oracle-actions/login-ocir@v1.3.0
        with:
          auth_token: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build i push Docker slike
        if: github.event_name == 'push'
        run: |
          IMAGE="${OCIR_REGION_KEY}.ocir.io/${OCIR_NAMESPACE}/${OCIR_REPO}"
          docker build -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

  deploy:
    name: Deploy na OKE
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure kubectl za OKE
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OKE_CLUSTER_OCID }}

      - name: Update image i apply manifest
        run: |
          IMAGE="${OCIR_REGION_KEY}.ocir.io/${OCIR_NAMESPACE}/${OCIR_REPO}:${IMAGE_TAG}"
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/kolokvij-deploy-cicd.yaml
          kubectl apply -f k8s/kolokvij-deploy-cicd.yaml

      - name: Verify rollout
        run: kubectl rollout status deployment/kolokvij --timeout=5m

      - name: Smoke test
        run: |
          EXT_IP=""
          for i in $(seq 1 30); do
            EXT_IP=$(kubectl get svc kolokvij-lb -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "${EXT_IP}" ] && break
            echo "Čekam Load Balancer IP... (${i}/30)"
            sleep 10
          done
          if [ -z "${EXT_IP}" ]; then
            echo "Load Balancer nije dobio IP u 5 minuta"
            exit 1
          fi
          URL="http://${EXT_IP}:8080/hello/CI"
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 5 "${URL}" > /tmp/resp; then
              echo "Smoke test OK:"; cat /tmp/resp; exit 0
            fi
            echo "Aplikacija još ne odgovara... (${i}/30)"
            sleep 10
          done
          echo "Aplikacija nije odgovorila u 5 minuta"
          exit 1
